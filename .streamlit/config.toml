[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f8ff"
textColor = "#31333F"

[client]
showErrorDetails = false
toolbarMode = "viewer"

[logger]
level = "info"

[server]
headless = true
port = 8501
# maxUploadSize belongs to [server], not [client].
maxUploadSize = 200
# enableCORS = false conflicts with enableXsrfProtection = true; Streamlit
# overrides it back to true and warns. Leave both at their safe defaults.
enableXsrfProtection = true
